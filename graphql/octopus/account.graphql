query viewer @bruce_required_by_default{
    viewer {
        id
        accounts {
            number
            brand
            overdueBalance
            billingName
            billingSubName @bruce_optional
            billingEmail @bruce_optional
        }
        givenName
        familyName
        email
        mobile
        landline
        title
        pronouns @bruce_optional
        isDeceased
        liveSecretKey @bruce_optional
        dateOfBirth @bruce_optional
        fullName
        preferredName
        alternativePhoneNumbers
        hasFamilyIssues
        isInHardship
        isOptedInToWof
    } 
}