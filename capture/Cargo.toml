[package]
name = "marco-sparko-capture"
version = "0.1.0"
edition = "2024"
resolver = "2"
description = "Firmware for an ESP32 Capture Device, which polls what Bruce's Smart Home needs while the computer sleeps"

# Firmware for a CYD (ESP32-2432S028R), with the wave-esp32c6-touch-147 feature a Waveshare ESP32-C6-Touch-LCD-1.47, or with
# the wave-esp32s3-rlcd-42 feature a Waveshare ESP32-S3-RLCD-4.2, built on ../../bruce-esp-idf, see README.md. It is its own Cargo project, not part of bruce-smart-home's build:
# cd capture && cargo build --release, see README.md for the Waveshare.

[[bin]]
name = "marco-sparko-capture"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[dependencies]
log = "0.4"
anyhow = "1.0.102"
croner = "3.0.1"
chrono = "0.4.44"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
url = "2.5.8"
embedded-graphics = "0.8"
# The graph's colours, see graph.rs.
rgb = "0.8.53"
# For myenergi's digest authentication, see myenergi.rs.
md-5 = "0.10"

# The store the device keeps its records in, as the app does, see bruce-db's docs/design.md, "Capture devices on the store".
bruce-db = "0.1.0"

bruce-embedded-std = { path = "../../bruce-embedded-std/bruce-embedded-std" }
bruce-esp-idf = { path = "../../bruce-esp-idf/bruce-esp-idf", features = ["sd-card"] }

esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
# Remove `generic-queue-8` if you plan to use `embassy-time` WITH `embassy-executor`
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
embedded-svc = "0.29.0"
esp-idf-sys = { version = "0.37.2", features = ["binstart"] }

# The board, exactly one: the CYD by default.
[features]
default = ["cyd-esp32-28"]
cyd-esp32-28 = ["bruce-esp-idf/board-cyd-esp32-28"]
# The platform needs its IMU support, ahrs, for the board's motion sensor.
wave-esp32c6-touch-147 = ["bruce-esp-idf/board-wave-esp32c6-touch-147", "bruce-esp-idf/ahrs", "touch"]
# A Waveshare ESP32-S3-RLCD-4.2, whose KEY button shows the status.
wave-esp32s3-rlcd-42 = ["bruce-esp-idf/board-wave-esp32s3-rlcd-42", "bruce-esp-idf/key-button"]
# A Guition JC3248W535C, whose BOOT button shows the status.
guition-jc3248w535c = ["bruce-esp-idf/board-guition-jc3248w535c", "bruce-esp-idf/boot-button", "touch"]
# A board with a touch screen, a swipe of which shows the status, see screen.rs.
touch = []

[build-dependencies]
embuild = "0.33"
