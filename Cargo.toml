[package]
name = "bruce-smart-home"
description = "The Energy Explorer"
version = "0.5.0"
edition = "2024"
default-run = "bruce-smart-home"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
bruce-graphql-builder = { path = "../bruce-graphql/bruce-graphql-builder" }
time = { version = "0.3", features = ["serde", "parsing", "formatting"] }

[dependencies]
semver = "1"
time = { version = "0.3", features = ["serde", "parsing", "formatting"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48.0", features = ["full"] }
dirs = "5.0"
clap = { version = "4.5.13", features = ["derive", "env"] }
async-trait = "0.1.81"
#once_cell = "1.19.0"
display_json = "0.2.1"
rust_decimal = "1.36.0"
rust_decimal_macros = "1.36.0"
bruce-graphql = {version = "0.5.0", path = "../bruce-graphql" }
# The store every module keeps its data in, see store.rs; a git-ignored .cargo/config.toml may patch in a checkout of
# bruce-db next to this one, to work on both.
bruce-db = "0.1.0"
# Flashing the capture firmware to boards on USB, from bruce-embedded-flash, checked out next to this repo.
bruce-embedded-flash-ui = { path = "../bruce-embedded-flash/bruce-embedded-flash-ui" }
#serde_with = "3.9.0"
#reedline-repl-rs = { version = "1.2.1", features = ["async"] }
futures = "0.3.31"
indexmap = "2.7.1"
time-tz = { version = "2.0.0", features = ["system"] }
#tzdb = "0.7.2"
#tz-rs = "0.7.0"
dioxus = { version = "0.7.10", features = ["router", "desktop"] }
dioxus-desktop = "0.7.10"
dioxus-free-icons = { version = "0.10", features = ["lucide"] }
# Native file dialogs, the same version and features as dioxus-desktop uses
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
# Clipboard access, text only
arboard = { version = "3", default-features = false }
anyhow = "1.0.100"
# Moves deleted profiles to the Trash (macOS), Recycle Bin (Windows) or freedesktop trash (Linux)
trash = "5"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
webbrowser = "1.0.6"
aho-corasick = "1.1"
regex = "1.11"
# The text of GloBird's bills, which are PDFs, in pure Rust so that a capture device could read them too
pdf-extract = "0.9"
rand = "0.9"
# Pinning a capture device's self-signed certificate, see capture_device.rs, the same rustls as reqwest's.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
hmac = "0.12"
# A capture device's poll schedule, the same cron specs as the device's, see capture_device.rs.
croner = "3.0.1"
chrono = "0.4"
# HTTP for the modules whose APIs are not GraphQL, the same version and features as bruce-graphql uses
reqwest = { version = "0.12.7", default-features = false, features = ["json", "rustls-tls", "charset", "http2", "macos-system-configuration"] }
# The digest authentication of the myenergi API
md-5 = "0.10"
# The GloBird portal's login, which encrypts the password with RSA-OAEP-SHA256 to the portal's public key
rsa = { version = "0.9", features = ["sha2", "getrandom"] }
base64 = "0.22"
keyring = "4.2"
chacha20poly1305 = "0.11"


# Windows only, to create files which only their owner can access, see private_file.rs
[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging"
]}

# macOS only, to position the system colour panel. The same versions as dioxus-desktop and rfd use.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSColorPanel", "NSEvent", "NSPanel", "NSGraphics", "NSResponder", "NSScreen", "NSWindow"] }

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]

# Reading a GloBird bill's PDF takes 600 ms in a debug build, 150 ms with these crates optimised, and 50 ms in a release
# build, so they are optimised in debug builds too, which only slows their first build.
# Reading the store parses tens of thousands of records for a week of Tesla snapshots or telemetry, which is several
# times slower unoptimised, so the store and the JSON parser are optimised in debug builds too.
[profile.dev.package.bruce-db]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package.pdf-extract]
opt-level = 3

[profile.dev.package.lopdf]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
